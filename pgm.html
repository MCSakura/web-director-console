<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PGM 成品画面</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #pgmVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;   /* 保持比例，不裁切不变形 */
      background: #000;
    }
    #pgmStatus {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      max-width: 80%;
      padding: 12px 20px;
      border-radius: 8px;
      background: rgba(0, 0, 0, .6);
      color: #8b98ab;
      font: 14px/1.6 "Microsoft YaHei", system-ui, sans-serif;
      text-align: center;
    }
    #pgmPlay {
      position: absolute;
      left: 50%; bottom: 8%;
      transform: translateX(-50%);
      display: none;
      padding: 12px 26px;
      border: 0; border-radius: 999px;
      background: rgba(22, 83, 47, .92);
      color: #d7ffe6;
      font: 16px/1 "Microsoft YaHei", system-ui, sans-serif;
      cursor: pointer;
      z-index: 10;
    }
    #pgmPlay:hover { background: rgba(31, 122, 69, .95); }
  </style>
</head>
<body>
  <video id="pgmVideo" autoplay playsinline></video>
  <div id="pgmStatus">正在连接…</div>
  <button id="pgmPlay">▶ 播放</button>

  <script src="js/config.js"></script>
  <script src="js/whep.js"></script>
  <script src="js/providers.js"></script>
  <script src="js/pgm.js"></script>
</body>
</html>
